<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트 글쓰기 — 교육성장네트워크 꿈들</title>
  <meta name="description" content="프로젝트 게시판 글쓰기 (회원 전용)" />
  <link rel="icon" type="image/png" href="favicon.png?v=20260913" />
  <!-- 문구(카피) 파일: 여기서 문구를 바꿉니다 -->
  <script src="assets/copy.js?v=20260913"></script>
  <script src="assets/copy-engine.js?v=20260913"></script>
  <link rel="stylesheet" href="assets/style.css?v=20260913" />
</head>
<body>
  <div id="site-header"></div>

  <!-- ★ 문구는 assets/copy.js (write · messages.write) 에서 바꿉니다. -->

  <div class="page-head">
    <div class="container">
      <div class="breadcrumb" data-copy="write.head.breadcrumb"><a href="index.html">홈</a> · <a href="board.html">프로젝트 게시판</a> · 글쓰기</div>
      <h1 data-copy="write.head.title">프로젝트 글쓰기</h1>
      <p data-copy="write.head.lead">회원이 프로젝트 소식·참여 후기를 남길 수 있습니다.</p>
    </div>
  </div>

  <section class="section">
    <div class="container" style="max-width:720px">
      <p class="note" id="guard" style="display:none"></p>
      <form class="apply-form card" id="write-form" style="display:none">
        <div class="fld"><label for="w-title"><span data-copy="write.form.titleLabel">제목</span> <span class="req">*</span></label><input id="w-title" type="text" required placeholder="제목" data-copy-attr="placeholder:write.form.titlePlaceholder" /></div>
        <div class="fld"><label for="w-body"><span data-copy="write.form.bodyLabel">내용</span> <span class="req">*</span></label><textarea id="w-body" rows="12" required placeholder="내용을 입력하세요." data-copy-attr="placeholder:write.form.bodyPlaceholder"></textarea></div>
        <button class="btn btn--primary btn--lg" type="submit" data-copy="write.form.submit">등록</button>
        <a class="btn btn--ghost" href="board.html" data-copy="write.form.cancel">취소</a>
        <p class="note" id="write-msg" style="margin-top:10px"></p>
      </form>
    </div>
  </section>

  <div id="site-footer"></div>
  <script src="assets/config.js?v=20260913"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/auth.js?v=20260913"></script>
  <script>
    (function () {
      /* 문구: assets/copy.js → messages.write */
      function T(k, d){ return window.KKUMDLE_T ? window.KKUMDLE_T(k, d) : d; }
      var M = window.KKUMDLE_MEMBER, DB = window.KKUMDLE_DB;
      var guard = document.getElementById("guard"), form = document.getElementById("write-form");
      async function init() {
        if (!M || !M.ready) { guard.style.display = ""; guard.textContent = T("messages.write.notConnected", "회원 기능이 아직 연결되지 않았습니다."); return; }
        await M.refresh();
        if (!M.isLoggedIn()) { guard.style.display = ""; guard.innerHTML = T("messages.write.loginRequired", "로그인이 필요합니다. <a href='login.html'>로그인 하기</a>"); return; }
        form.style.display = "";
      }
      window.addEventListener("load", function(){ setTimeout(init, 300); });
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var msg = document.getElementById("write-msg"); msg.style.color = ""; msg.textContent = T("messages.write.saving", "등록 중…");
        try {
          await DB.createProjectPost(document.getElementById("w-title").value.trim(), document.getElementById("w-body").value.trim());
          location.href = "board.html";
        } catch (err) { msg.style.color = "#c0392b"; msg.textContent = T("messages.write.fail", "등록 실패: ") + (err.message || ""); }
      });
    })();
  </script>
  <script src="assets/site.js?v=20260913"></script>
</body>
</html>
